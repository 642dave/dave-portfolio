<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galerie kreseb Davida Rakovského – realistické portréty, zvířata a další kresby.">
  <title>Kresby | Rocky Art – David Rakovský</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="container">
    <section class="projects-section">
      <h1 class="section-title">Galerie kreseb</h1>

      <p class="section-text">
        Kresby, ve kterých zachycuji podobu, charakter a příběh.
        Od realistických portrétů a zvířat až po další motivy.
      </p>

      <div class="projects-grid">
        <article class="project-card">
          <img
            src="img/kresby/kote.jpg"
            alt="Kresba kotěte"
            class="artwork-image"
            loading="lazy"
          >
          <h3>Koťe</h3>
          <p>Autorská kresba.</p>
        </article>
      </div>

      <p>
        <a href="index.html#gallery" class="cta-button">← Zpět na Rocky Art</a>
      </p>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
