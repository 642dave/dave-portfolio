<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galerie malovaných obrazů Davida Rakovského – originální tvorba Rocky Art.">

  <title>Obrazy | Rocky Art – David Rakovský</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container">
    <section class="projects-section">
      <h1 class="section-title">Malované obrazy</h1>

      <p class="section-text">
        Originální malby, ve kterých hledám atmosféru, barvy a příběhy.
      </p>

      <div class="projects-grid">

        <article class="project-card">
          <img
            src="img/obrazy/slunecnice.jpg"
            alt="Slunečnice – olejomalba na plátně"
            class="artwork-image"
            tabindex="0"
            role="button"
            aria-label="Zvětšit fotografii Slunečnic">

          <p class="artwork-caption">
            <strong>Slunečnice</strong><br>
            Olej na plátně · 50 × 70 cm · 2026
          </p>
        </article>

        <article class="project-card">
          <img
            src="img/obrazy/highland.jpg"
            alt="Highland – olejomalba na plátně"
            class="artwork-image"
            tabindex="0"
            role="button"
            aria-label="Zvětšit fotografii Highland">

          <p class="artwork-caption">
            <strong>Highland</strong><br>
            Olej na plátně · 40 × 50 cm · 2026
          </p>
        </article>

        <article class="project-card">
          <img
            src="img/obrazy/duhovy pes.jpg"
            alt="Duhový pes – olejomalba na plátně"
            class="artwork-image"
            tabindex="0"
            role="button"
            aria-label="Zvětšit fotografii Duhového psa">

          <p class="artwork-caption">
            <strong>Duhový pes</strong><br>
            Olej na plátně · 30 × 40 cm · 2026
          </p>
        </article>
      </div>

      <p>
        <a href="index.html#gallery" class="cta-button">← Zpět na Rocky Art</a>
      </p>
    </section>
  </main>

  <script src="js/main.js"></script>

</body>
</html>
